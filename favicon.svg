<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark brown background matching the image -->
  <rect width="100" height="100" fill="#2C1A06"/>

  <!-- Hammer head (top-right block) -->
  <rect x="52" y="14" width="32" height="20" rx="4" ry="4"
        fill="#C9A84C"
        transform="rotate(-45 68 24)"/>

  <!-- Hammer handle (diagonal going bottom-left) -->
  <rect x="12" y="44" width="52" height="13" rx="5" ry="5"
        fill="#C9A84C"
        transform="rotate(-45 38 50)"/>
</svg>
