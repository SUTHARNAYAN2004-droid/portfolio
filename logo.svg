<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark brown background -->
  <rect width="100" height="100" fill="#2C1A06"/>

  <!-- Outer circle -->
  <circle cx="50" cy="52" r="30" fill="none" stroke="#C9A84C" stroke-width="3"/>

  <!-- Hammer handle — diagonal line bottom-left -->
  <line x1="32" y1="70" x2="58" y2="44" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>

  <!-- Hammer head — rectangular block top-right -->
  <rect x="54" y="30" width="20" height="11" rx="3"
        fill="#C9A84C"
        transform="rotate(-45 64 35.5)"/>

  <!-- Hammer head face (darker top) -->
  <rect x="54" y="30" width="8" height="11" rx="2"
        fill="#A07830"
        transform="rotate(-45 64 35.5)"/>
</svg>
